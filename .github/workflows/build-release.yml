name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Create default bundled config
        shell: pwsh
        run: |
          $config = [ordered]@{
            url = "https://dav.jianguoyun.com/dav/"
            username = ""
            password = ""
            source_path = "D:/finalshell"
          }

          $config | ConvertTo-Json | Set-Content -Path "config.json" -Encoding utf8

      - name: Build executable
        run: |
          pyinstaller --onefile --windowed --name "FinalshellBackUpAssistant" --add-data "config.json;." main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinalshellBackUpAssistant-windows
          path: dist/FinalshellBackUpAssistant.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: FinalshellBackUpAssistant-windows

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## FinalshellBackUpAssistant ${{ steps.get_version.outputs.VERSION }}
            
            ### 下载说明
            - 下载 `FinalshellBackUpAssistant.exe` 文件即可使用
            - 无需安装 Python 环境
            - 公开发行版内置坚果云默认地址，用户名和密码为空
            
            ### 更新内容
            请查看提交记录了解详细更新内容。
          files: FinalshellBackUpAssistant.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
